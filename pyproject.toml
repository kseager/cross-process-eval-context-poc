[project]
name = "span-exact-eval-poc"
version = "0.1.0"
description = "Span-exact, cross-process evaluation correlation to a specific invoke_agent span, with no agent-side code changes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agent-framework",
    "azure-identity",
    "azure-monitor-opentelemetry",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    "python-dotenv",
]

[project.scripts]
run-poc = "span_exact_eval_poc.runner:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/span_exact_eval_poc"]
