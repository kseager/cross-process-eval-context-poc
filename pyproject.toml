[project]
name = "span-two-process-eval-poc"
version = "0.1.0"
description = "Span-exact, cross-process evaluation correlation to a specific invoke_agent span, with no agent-side code changes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agent-framework",
    "azure-identity",
    "azure-monitor-opentelemetry",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    "python-dotenv",
]

[project.scripts]
run-poc = "span_two_process_eval_poc.eval_worker:cli"
run-attach-after = "span_two_process_eval_poc.attach_after:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/span_two_process_eval_poc"]
